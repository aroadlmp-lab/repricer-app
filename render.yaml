databases:
  - name: repricer-db
    plan: free
    databaseName: repricer

services:
  - type: web
    name: repricer
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn app:create_app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repricer-db
          property: connectionString
      - key: FERNET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: NODE_VERSION
        value: "20.10.0"
